name: Compilar juego

on:
  workflow_dispatch:
  push:
    paths:
      - "game_project.zip"
      - ".github/workflows/build.yml"

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Preparar proyecto
        run: |
          if [ ! -f game_project.zip ]; then
            echo "Falta game_project.zip en la raiz del repositorio"
            exit 1
          fi
          SWF="$(ls ./*.swf 2>/dev/null | head -1)"
          if [ -z "$SWF" ]; then
            echo "Falta el archivo .swf en la raiz del repositorio"
            exit 1
          fi
          echo "Usando SWF: $SWF"
          rm -rf game
          unzip -o game_project.zip -d game
          mkdir -p game/assets
          cp "$SWF" game/assets/game.swf

      - name: Instalar librerias de Haxe
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib --always install lime
          haxelib --always install openfl
          haxelib --always install format || true
          haxelib --always install actuate || true
          haxelib --always install swf
          haxelib list

      - name: Instalar Android NDK r21e
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;21.4.7075529"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compilar APK (release, optimizado)
        working-directory: game
        run: |
          keytool -genkeypair -keystore "$PWD/k.jks" -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Juego"
          sed -i "s#</project>#<certificate path=\"$PWD/k.jks\" alias=\"key\" password=\"android123\" alias-password=\"android123\" if=\"android\" /></project>#" project.xml
          haxelib run openfl update android -release
          RES="$(find Export/android -type d -path '*src/main/res' | head -1)"
          echo "Carpeta res: $RES"
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/drawable-nodpi"
          cp android_icon/ic_launcher_adaptive.png "$RES/drawable-nodpi/ic_launcher_adaptive.png"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_adaptive"/>
              <foreground android:drawable="@drawable/ic_launcher_adaptive"/>
          </adaptive-icon>
          EOF
          haxelib run openfl build android -release

      - name: Reunir APK
        run: |
          mkdir -p dist
          find game/Export/android -name "*.apk" -exec cp {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "No se genero ningun APK"
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: juego-apk
          path: dist
          if-no-files-found: error
